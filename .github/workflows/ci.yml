name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: auto

jobs:
  go:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cc-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: cc-runtime

      - uses: actions/setup-go@v5
        with:
          go-version-file: cc-runtime/go.mod
          cache: true
          cache-dependency-path: cc-runtime/go.sum
          check-latest: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
