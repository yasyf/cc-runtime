name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: cc-runtime

      # go.mod carries a temporary sibling replace for cc-interact
      # (cc-notes 6f1b937); clone it next to this checkout.
      - uses: actions/checkout@v4
        with:
          repository: yasyf/cc-interact
          path: cc-interact

      - uses: actions/setup-go@v5
        with:
          go-version-file: cc-runtime/go.mod
          cache: true
          cache-dependency-path: cc-runtime/go.sum
          check-latest: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
