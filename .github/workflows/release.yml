name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: ./scripts/release-preflight.sh

  release:
    needs: release-preflight
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@ece42cf8ab45ff65af679a43896ea19399e242ee
    secrets: inherit
    with:
      plugin-manifest: plugin/.claude-plugin/plugin.json
